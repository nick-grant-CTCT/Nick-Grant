# Product strategy source file.
# Copy this file to strategy/<slug>.yml in the workspace root.
# schema_version stays 1. Fill values. Do not add keys.
# status: empty | draft | confirmed | skipped
# Set skip_reason only when status is skipped.
# Leave unknown links as "". Set assumption only when the user stated a working assumption.

